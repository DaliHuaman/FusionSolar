name: TEMPORAL leer potencia activa máxima
on:
  push:
    branches: [claude/project-thread-hfcclx]
permissions:
  contents: read
jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - env:
          FUSIONSOLAR_USER: ${{ secrets.FUSIONSOLAR_USER }}
          FUSIONSOLAR_PASSWORD: ${{ secrets.FUSIONSOLAR_PASSWORD }}
          FUSIONSOLAR_STATE: ${{ runner.temp }}/fusionsolar
        run: python run.py --potencia-maxima
