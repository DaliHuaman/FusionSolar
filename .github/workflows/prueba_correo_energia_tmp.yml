name: TEMPORAL correo de prueba energía exportada

# TEMPORAL (se borra antes de fusionar): envía el correo de prueba SOLO a copia@correo.invalido.
on:
  push:
    branches: [claude/project-thread-ala491]

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Enviar correo de prueba
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          ALERTA_REMITENTE: ${{ vars.ALERTA_REMITENTE }}
          FUSIONSOLAR_STATE: ${{ runner.temp }}/fusionsolar
        run: python run.py --probar-correo-energia --para copia@correo.invalido
