name: Probar correo de alertas

# Solo envía el correo de ejemplo (usa los secretos SMTP_*). No entra al portal ni toca la rama data ni el dashboard.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Traer umbrales reales (rama data)
        run: |
          mkdir -p "${{ runner.temp }}/fusionsolar"
          git fetch -q --depth 1 origin data && git show FETCH_HEAD:umbrales.json > "${{ runner.temp }}/fusionsolar/umbrales.json" || echo "sin umbrales.json: se usan los del JSON"
      - name: Enviar correo de prueba
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          ALERTA_REMITENTE: ${{ vars.ALERTA_REMITENTE }}
          ALERTA_DESTINATARIOS: ${{ secrets.ALERTA_DESTINATARIOS || vars.ALERTA_DESTINATARIOS }}   # secreto (no se ve en los registros); se suma a config
          ALERTA_COPIA: ${{ secrets.ALERTA_COPIA || vars.ALERTA_COPIA }}                           # secreto: copia (CC); se suma a config
          FUSIONSOLAR_STATE: ${{ runner.temp }}/fusionsolar
        run: python run.py --probar-correo
