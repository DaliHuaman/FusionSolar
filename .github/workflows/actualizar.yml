name: Actualizar indicadores FusionSolar

on:
  # Lo dispara cron-job.org cada 30 min (API workflow_dispatch) y también se puede lanzar a mano desde Actions.
  workflow_dispatch:
    inputs:
      probar_correo:
        description: "Enviar un correo de prueba de alertas antes de la corrida (requiere los secretos SMTP)"
        type: boolean
        default: false

permissions:
  contents: write                # publicar la rama "data" con el Excel
  pages: write                   # desplegar el dashboard web
  id-token: write

# una sola corrida a la vez: evita que dos ejecuciones se pisen al escribir el Excel
concurrency:
  group: fusionsolar-actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias y navegador
        run: |
          # Cada descarga se reintenta (3 intentos, espera creciente) ante fallos pasajeros de red/DNS.
          bash .github/scripts/reintentar.sh 3 15 pip install -r requirements.txt
          # Chromium se baja del CDN de Playwright (no depende de los espejos apt de Ubuntu).
          bash .github/scripts/reintentar.sh 3 15 python -m playwright install chromium
          # Las librerías del sistema ya vienen en la imagen del runner; install-deps solo agrega
          # fuentes extra. Si los espejos apt de Ubuntu fallan (DNS caído), no se tumba la corrida.
          timeout 180 python -m playwright install-deps chromium \
            || echo "::warning::No se pudieron instalar dependencias apt de Playwright (espejos Ubuntu); se continúa con las de la imagen."

      # La rama "data" guarda solo el Excel/CSV (un único commit que se reescribe; el repo no crece).
      - name: Traer histórico (rama data)
        run: |
          REMOTE="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$REMOTE" data >/dev/null 2>&1; then
            bash .github/scripts/reintentar.sh 3 10 git clone --depth 1 --branch data "$REMOTE" datos
          else
            mkdir datos && git -C datos init -q -b data && git -C datos remote add origin "$REMOTE"
          fi

      - name: Correo de prueba (solo si se pide al lanzar)
        if: ${{ inputs.probar_correo }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}                       # opcional (por defecto smtp.gmail.com)
          SMTP_PORT: ${{ vars.SMTP_PORT }}                       # opcional (por defecto 465)
          ALERTA_REMITENTE: ${{ vars.ALERTA_REMITENTE }}         # opcional (por defecto = SMTP_USER)
          ALERTA_DESTINATARIOS: ${{ vars.ALERTA_DESTINATARIOS }} # opcional: reemplaza a config alertas.destinatarios
        run: python run.py --probar-correo

      - name: Extraer de FusionSolar y actualizar Excel
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}                       # opcional (por defecto smtp.gmail.com)
          SMTP_PORT: ${{ vars.SMTP_PORT }}                       # opcional (por defecto 465)
          ALERTA_REMITENTE: ${{ vars.ALERTA_REMITENTE }}         # opcional (por defecto = SMTP_USER)
          ALERTA_DESTINATARIOS: ${{ vars.ALERTA_DESTINATARIOS }} # opcional: reemplaza a config alertas.destinatarios
          FUSIONSOLAR_USER: ${{ secrets.FUSIONSOLAR_USER }}
          FUSIONSOLAR_PASSWORD: ${{ secrets.FUSIONSOLAR_PASSWORD }}
          EXCEL_DIR: ${{ github.workspace }}/datos
          EXCEL_NOMBRE: Indicadores_FusionSolar.xlsx
          HISTORICO_CSV: ${{ github.workspace }}/datos/historico.csv
          FUSIONSOLAR_STATE: ${{ runner.temp }}/fusionsolar
        # Si la corrida completa falla (portal caído, login, red), se repite hasta 2 veces más tras 60 s y 120 s.
        # Cada intento tiene tope de 8 min para que un cuelgue no consuma todo el tiempo del job; antes de cada
        # intento se borra el candado de run.py (si timeout cortó el anterior, quedaría y el reintento se saltaría).
        run: |
          bash .github/scripts/reintentar.sh 3 60 \
            bash -c 'rm -f "$FUSIONSOLAR_STATE/run.lock"; timeout 480 python run.py'

      - name: Guardar histórico (rama data)
        run: |
          cd datos
          git add -A
          git -c user.name="FusionSolar Bot" -c user.email="fusionsolar-bot@users.noreply.github.com" \
            commit -q --allow-empty --amend -m "Datos $(date -u +'%Y-%m-%d %H:%M') UTC" 2>/dev/null \
            || git -c user.name="FusionSolar Bot" -c user.email="fusionsolar-bot@users.noreply.github.com" \
                 commit -q -m "Datos $(date -u +'%Y-%m-%d %H:%M') UTC"
          bash .github/scripts/reintentar.sh 3 10 git push -q --force origin HEAD:data

      - name: Preparar dashboard web
        run: |
          mkdir -p site
          cp -r docs/. site/
          cp "${{ runner.temp }}/fusionsolar/site/data/data.json" site/data/data.json
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: pages
        uses: actions/deploy-pages@v4
