name: TEMPORAL prueba lectura energía exportada

# TEMPORAL (se borra antes de fusionar): al subir la rama de desarrollo, lee del portal la energía exportada en modo prueba
# (solo deja en el log lo que encuentra; no guarda nada en la rama "data" ni envía correos).
on:
  push:
    branches: [claude/project-thread-ala491]

permissions:
  contents: read

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: |
          bash .github/scripts/reintentar.sh 3 15 pip install -r requirements.txt
          bash .github/scripts/reintentar.sh 3 15 python -m playwright install chromium
          timeout 180 python -m playwright install-deps chromium || true
      - name: Leer (prueba)
        env:
          FUSIONSOLAR_USER: ${{ secrets.FUSIONSOLAR_USER }}
          FUSIONSOLAR_PASSWORD: ${{ secrets.FUSIONSOLAR_PASSWORD }}
          HISTORICO_CSV: ${{ runner.temp }}/datos/historico.csv
          FUSIONSOLAR_STATE: ${{ runner.temp }}/fusionsolar
        run: timeout 1500 python run.py --energia-exportada --prueba
